<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIMA Knowledge Centre | Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { margin: 0; font-family: 'Poppins', sans-serif; overflow: hidden; background-color: #f4f6f8; }
        
        .nirma-header { background-color: #D32F2F; color: white; padding: 10px 20px; display: flex; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; z-index: 1000; height: 70px; }
        .header-content { display: flex; align-items: center; gap: 15px; }
        .header-logo { height: 50px; background: white; padding: 2px; border-radius: 4px; }
        .header-titles { display: flex; flex-direction: column; }
        /* ✅ Changed to NIMA Knowledge Centre */
        .header-titles h1 { font-size: 18px; margin: 0; font-weight: 700; line-height: 1.2; }
        .header-titles h2 { font-size: 12px; margin: 0; font-weight: 400; opacity: 0.9; }

        .landing-bg { height: calc(100vh - 70px); background: linear-gradient(rgba(30, 42, 74, 0.7), rgba(30, 42, 74, 0.7)), url('../images/nimasitting.jpg'); background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 90%; max-width: 400px; text-align: center; }
        .login-card h2 { margin-top: 0; color: #1e2a4a; font-size: 22px; margin-bottom: 5px; }
        .login-card p { color: #64748b; font-size: 14px; margin-bottom: 30px; }

        .login-btn { width: 100%; padding: 15px; margin-bottom: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; font-family: 'Poppins', sans-serif; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-student { background: white; color: #444; border: 2px solid #ddd; }
        .btn-student:hover { background: #f8f9fa; border-color: #ccc; }
        .btn-student img { width: 20px; }
        .btn-staff { background: #34495e; color: white; }
        .btn-staff:hover { background: #2c3e50; }
        .btn-admin { background: #D32F2F; color: white; margin-bottom: 0; }
        .btn-admin:hover { background: #b71c1c; }
        @media (max-width: 600px) { .header-titles h2 { display: none; } }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

<header class="nirma-header">
    <div class="header-content">
        <img src="../images/nimalogo.jpg" alt="NIMA Logo" class="header-logo">
        <div class="header-titles">
            <h1>NIMA Knowledge Centre</h1>
            <h2>Room Booking Portal</h2>
        </div>
    </div>
</header>

<div class="landing-bg">
    <div class="login-card">
        <h2>Welcome to Nima Library</h2>
        <p>Please select your portal to continue</p>

        <button class="login-btn btn-student" onclick="studentLogin()">
            <img src="https://img.icons8.com/color/48/000000/google-logo.png" alt="Google">
            Student Login
        </button>
        <button class="login-btn btn-staff" onclick="window.location.href='staff.html'">
            <i class="fa-solid fa-user-tie"></i> Staff Login
        </button>
        <button class="login-btn btn-admin" onclick="window.location.href='admin.html'">
            <i class="fa-solid fa-shield-halved"></i> Admin Login
        </button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBM7-ufYhqO5Uo2PpM-4x_R0sRMCVnQqPE",
        authDomain: "nimalibrary-cbceb.firebaseapp.com",
        databaseURL: "https://nimalibrary-cbceb-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "nimalibrary-cbceb",
        storageBucket: "nimalibrary-cbceb.firebasestorage.app",
        messagingSenderId: "480609468196",
        appId: "1:480609468196:web:5281f1507baaa4780b3db1",
        measurementId: "G-67XY9ZF713"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    function studentLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        
        firebase.auth().signInWithPopup(provider)
        .then((result) => {
            const userEmail = result.user.email;
            
            if (userEmail.endsWith("@nirmauni.ac.in")) {
                localStorage.setItem("studentEmail", userEmail);
                window.location.href = "booking.html";
            } else {
                firebase.auth().signOut();
                alert("⛔ Access Denied!\nYou must use your official @nirmauni.ac.in email address.");
            }
        })
        .catch((error) => {
            console.error("Login Failed:", error);
            if (error.code !== 'auth/popup-closed-by-user') {
                alert("Login failed. Check console for details.");
            }
        });
    }
</script>

</body>
</html>
