<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librarian Dashboard | Nima Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Admin Specific Styles */
        .admin-header { 
            background: linear-gradient(135deg, #c0392b, #e74c3c); 
            color: white; 
            padding: 25px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
        }
        
        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }

        .booking-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .booking-table th { background: #f8f9fa; padding: 12px; text-align: left; }
        .booking-table td { padding: 12px; border-bottom: 1px solid #eee; }
        
        .delete-btn {
            background: #ffebee; color: #c0392b; border: 1px solid #c0392b;
            padding: 6px 12px; border-radius: 4px; cursor: pointer;
        }
        .delete-btn:hover { background: #c0392b; color: white; }

        .block-btn {
            background: #34495e; color: white; border: none;
            padding: 10px; width: 100%; border-radius: 6px; cursor: pointer;
            margin-top: 10px;
        }

        /* --- LOGIN OVERLAY STYLES --- */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.95); z-index: 999;
            display: flex; justify-content: center; align-items: center;
        }
        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            text-align: center; 
            width: 320px; 
            position: relative; /* Needed for the X button positioning */
        }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; box-sizing: border-box;}
        
        /* THE NEW CLOSE BUTTON */
        .close-login-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #999;
            font-size: 20px;
            text-decoration: none;
            transition: 0.2s;
            cursor: pointer;
        }
        .close-login-btn:hover {
            color: #c0392b;
            transform: scale(1.1);
        }

        @media (max-width: 600px) {
            .control-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <a href="index.html" class="close-login-btn" title="Back to Home">
            <i class="fa-solid fa-xmark"></i>
        </a>

        <i class="fa-solid fa-user-shield" style="font-size: 40px; color: #c0392b; margin-bottom: 15px;"></i>
        <h2>Admin Login</h2>
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button class="main-btn" onclick="checkLogin()">Access Dashboard</button>
    </div>
</div>

<div class="main-wrapper">
    <div class="container" style="max-width: 1000px;">
        
        <div class="admin-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1><i class="fa-solid fa-shield-halved"></i> Librarian Dashboard</h1>
                    <p style="margin:0; opacity: 0.9;">Manage reservations & Facility Status</p>
                </div>
                <button class="main-btn" style="width: auto; padding: 8px 15px; font-size: 13px; background: rgba(255,255,255,0.2);" onclick="location.reload()">
                    Logout
                </button>
            </div>
        </div>

        <div class="control-grid">
            <div class="control-card">
                <h3><i class="fa-solid fa-ban" style="color:#c0392b;"></i> Close Library (Full Day)</h3>
                <p style="font-size: 13px; color: #666;">Close booking for festivals or holidays.</p>
                <input type="date" id="blockDateInput" style="width:100%; padding:10px; margin-top:10px; border:1px solid #ddd;">
                <input type="text" id="blockReason" placeholder="Reason (e.g. Holi)" style="width:100%; padding:10px; margin-top:10px; border:1px solid #ddd;">
                <button class="block-btn" onclick="blockDay()">Close This Date</button>
            </div>

            <div class="control-card">
                <h3><i class="fa-solid fa-clock" style="color:#f39c12;"></i> Block Specific Slot</h3>
                <p style="font-size: 13px; color: #666;">Reserve a slot as "Maintenance" to block it.</p>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top:10px;">
                    <input type="date" id="slotDate" style="padding:10px; border:1px solid #ddd;">
                    <select id="slotTime" style="padding:10px; border:1px solid #ddd;">
                        <option>09:00 AM - 10:00 AM</option>
                        <option>10:00 AM - 11:00 AM</option>
                        <option>11:00 AM - 12:00 PM</option>
                        <option>12:00 PM - 01:00 PM</option>
                        <option>01:00 PM - 02:00 PM</option>
                        <option>02:00 PM - 03:00 PM</option>
                        <option>03:00 PM - 04:00 PM</option>
                        <option>04:00 PM - 05:00 PM</option>
                    </select>
                </div>
                <select id="slotRoom" style="width:100%; padding:10px; margin-top:10px; border:1px solid #ddd;">
                    <option>Room 501</option><option>Room 502</option><option>Room 503</option><option>Room 504</option>
                    <option>Room 505</option><option>Room 506</option><option>Room 507</option>
                    <option>Room 601</option><option>Room 602</option>
                    <option>Room 701</option><option>Room 702</option>
                    <option>Room 801</option><option>Room 802</option>
                </select>
                <button class="block-btn" style="background: #f39c12;" onclick="blockSlot()">Block This Slot</button>
            </div>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin:0;"><i class="fa-solid fa-list"></i> Active Bookings</h3>
                <button class="main-btn" style="width: auto; padding: 8px 15px; font-size: 14px;" onclick="loadAllBookings()">
                    <i class="fa-solid fa-rotate"></i> Refresh
                </button>
            </div>

            <div style="overflow-x: auto;">
                <table class="booking-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Room</th>
                            <th>Booked By</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script>
    // ✅ CHECK THIS URL (Must match your backend)
    const BACKEND_URL = "https://nima-backend.vercel.app"; 

    // 1. LOGIN
    async function checkLogin() {
        const pass = document.getElementById("adminPass").value;
        try {
            const res = await fetch(`${BACKEND_URL}/admin-login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password: pass })
            });
            const result = await res.json();
            if (result.status === "success") {
                document.getElementById("loginOverlay").style.display = "none";
                loadAllBookings();
            } else { alert("❌ Wrong Password"); }
        } catch (err) { alert("Server Error"); }
    }

    // 2. LOAD DATA
    async function loadAllBookings() {
        const tbody = document.getElementById("adminTableBody");
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Loading...</td></tr>`;
        try {
            const res = await fetch(`${BACKEND_URL}/admin/all-bookings`);
            const data = await res.json();
            tbody.innerHTML = ""; 
            if (data.bookings && data.bookings.length > 0) {
                // Sort by Date (Newest first)
                data.bookings.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                data.bookings.forEach(b => {
                    let rowStyle = "";
                    let nameDisplay = `<strong>${b.leader}</strong><br><span style="font-size:12px; color:#888;">${b.roll_no}</span>`;
                    
                    if (b.leader === "ADMIN BLOCK" || b.leader === "MAINTENANCE") {
                        rowStyle = "background: #fff3e0;";
                        nameDisplay = `<strong style="color: #d35400;">⚠️ BLOCKED BY ADMIN</strong>`;
                    }

                    const row = `
                        <tr style="${rowStyle}">
                            <td>${b.date}</td>
                            <td>${b.time_slot}</td>
                            <td>${b.room_id}</td>
                            <td>${nameDisplay}</td>
                            <td>
                                <button class="delete-btn" onclick="deleteBooking('${b.room_id}', '${b.date}', '${b.time_slot}')">
                                    <i class="fa-solid fa-trash"></i> Cancel
                                </button>
                            </td>
                        </tr>`;
                    tbody.innerHTML += row;
                });
            } else { tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No bookings found.</td></tr>`; }
        } catch (err) { console.error(err); }
    }

    // 3. DELETE (SENDS EMAIL AUTOMATICALLY)
    async function deleteBooking(roomId, date, timeSlot) {
        if (!confirm(`Cancel this booking? The student will be notified via email.`)) return;
        try {
            const res = await fetch(`${BACKEND_URL}/cancel-booking`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ room_id: roomId, date: date, time_slot: timeSlot })
            });
            const result = await res.json();
            if (result.status === "success") {
                alert("Booking Cancelled & Email Sent!");
                loadAllBookings();
            } else { alert("Error: " + result.message); }
        } catch (err) { alert("Failed."); }
    }

    // 4. BLOCK DAY
    async function blockDay() {
        const date = document.getElementById('blockDateInput').value;
        const reason = document.getElementById('blockReason').value || "Closed";
        if(!date) return alert("Select a date");

        try {
            const res = await fetch(`${BACKEND_URL}/admin/block-day`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ date: date, reason: reason })
            });
            alert("Date Blocked Successfully!");
        } catch (err) { alert("Error blocking date"); }
    }

    // 5. BLOCK SPECIFIC SLOT
    async function blockSlot() {
        const date = document.getElementById('slotDate').value;
        const time = document.getElementById('slotTime').value;
        const room = document.getElementById('slotRoom').value;

        if(!date) return alert("Select a date");

        const bookingData = {
            room_id: room,
            date: date,
            time_slot: time,
            leader_name: "ADMIN BLOCK",
            leader_roll_no: "N/A",
            group_size: "0",
            email: "", 
            details: { purpose: "Maintenance/Closure" }
        };

        try {
            const res = await fetch(`${BACKEND_URL}/confirm-booking`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(bookingData)
            });
            const result = await res.json();
            if(result.status === "success") {
                alert("Slot Blocked Successfully!");
                loadAllBookings();
            } else {
                alert("Slot is already booked/blocked!");
            }
        } catch(err) { alert("Error"); }
    }
</script>
</body>
</html>
