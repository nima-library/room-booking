<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librarian Dashboard | Nima Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-header { background: linear-gradient(135deg, #c0392b, #e74c3c); color: white; padding: 25px; border-radius: 10px; margin-bottom: 20px; }
        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .control-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .booking-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .booking-table th { background: #f8f9fa; padding: 12px; text-align: left; border-bottom: 2px solid #ddd;}
        .booking-table td { padding: 12px; border-bottom: 1px solid #eee; }
        .delete-btn { background: #ffebee; color: #c0392b; border: 1px solid #c0392b; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .delete-btn:hover { background: #c0392b; color: white; }
        .block-btn { background: #34495e; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.95); z-index: 999; display: flex; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 10px; text-align: center; width: 320px; position: relative; }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; box-sizing: border-box;}
        .close-login-btn { position: absolute; top: 15px; right: 15px; color: #999; font-size: 20px; text-decoration: none; cursor: pointer; }
        
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .filter-grid label { font-size: 12px; font-weight: 600; color: #666; display: block; margin-bottom: 4px; }
        .filter-grid input, .filter-grid select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Poppins'; }

        @media (max-width: 600px) { .control-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <a href="index.html" class="close-login-btn" title="Back to Home"><i class="fa-solid fa-xmark"></i></a>
        <i class="fa-solid fa-user-shield" style="font-size: 40px; color: #c0392b; margin-bottom: 15px;"></i>
        <h2>Admin Login</h2>
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button class="main-btn" onclick="checkLogin()">Access Dashboard</button>
    </div>
</div>

<div class="main-wrapper">
    <div class="container" style="max-width: 1000px;">
        
        <div class="admin-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1><i class="fa-solid fa-shield-halved"></i> Librarian Dashboard</h1>
                    <p style="margin:0; opacity: 0.9;">Manage reservations & Reports</p>
                </div>
                <button class="main-btn" style="width: auto; padding: 8px 15px; font-size: 13px; background: rgba(255,255,255,0.2);" onclick="location.reload()">Logout</button>
            </div>
        </div>

        <div class="control-grid">
            <div class="control-card">
                <h3><i class="fa-solid fa-ban" style="color:#c0392b;"></i> Close Library (Full Day)</h3>
                <input type="date" id="blockDateInput" style="width:100%; padding:10px; margin-top:10px; border:1px solid #ddd;">
                <input type="text" id="blockReason" placeholder="Reason (e.g. Holi)" style="width:100%; padding:10px; margin-top:10px; border:1px solid #ddd;">
                <button class="block-btn" onclick="blockDay()">Close This Date</button>
            </div>

            <div class="control-card">
                <h3><i class="fa-solid fa-clock" style="color:#f39c12;"></i> Close Specific Hours</h3>
                <input type="date" id="rangeDate" style="width:100%; padding:10px; margin-top:10px; border:1px solid #ddd;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top:10px;">
                    <div>
                        <label style="font-size: 12px; color: #666;">From:</label>
                        <select id="timeStart" style="padding:10px; border:1px solid #ddd; width:100%;">
                            <option value="08:00 AM - 09:00 AM">08:00 AM</option>
                            <option value="09:00 AM - 10:00 AM">09:00 AM</option>
                            <option value="10:00 AM - 11:00 AM">10:00 AM</option>
                            <option value="11:00 AM - 12:00 PM">11:00 AM</option>
                            <option value="12:00 PM - 01:00 PM">12:00 PM</option>
                            <option value="01:00 PM - 02:00 PM">01:00 PM</option>
                            <option value="02:00 PM - 03:00 PM">02:00 PM</option>
                            <option value="03:00 PM - 04:00 PM">03:00 PM</option>
                            <option value="04:00 PM - 05:00 PM">04:00 PM</option>
                            <option value="05:00 PM - 06:00 PM">05:00 PM</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 12px; color: #666;">To:</label>
                        <select id="timeEnd" style="padding:10px; border:1px solid #ddd; width:100%;">
                            <option value="09:00 AM - 10:00 AM">10:00 AM</option>
                            <option value="10:00 AM - 11:00 AM">11:00 AM</option>
                            <option value="11:00 AM - 12:00 PM">12:00 PM</option>
                            <option value="12:00 PM - 01:00 PM">01:00 PM</option>
                            <option value="01:00 PM - 02:00 PM">02:00 PM</option>
                            <option value="02:00 PM - 03:00 PM">03:00 PM</option>
                            <option value="03:00 PM - 04:00 PM">04:00 PM</option>
                            <option value="04:00 PM - 05:00 PM">05:00 PM</option>
                            <option value="05:00 PM - 06:00 PM">06:00 PM</option>
                        </select>
                    </div>
                </div>
                <button class="block-btn" style="background: #f39c12;" onclick="blockHourRange()">Close These Hours</button>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 20px;"><i class="fa-solid fa-chart-bar"></i> Usage Report (Summary Day Wise)</h3>
            
            <div class="filter-grid">
                <div><label>Date From:</label><input type="date" id="filterDateFrom"></div>
                <div><label>Date To:</label><input type="date" id="filterDateTo"></div>
                <div>
                    <label>Floor No:</label>
                    <select id="filterFloor">
                        <option value="All">All</option>
                        <option value="5">5th Floor</option><option value="6">6th Floor</option>
                        <option value="7">7th Floor</option><option value="8">8th Floor</option>
                    </select>
                </div>
                <div>
                    <label>Room No:</label>
                    <select id="filterRoom">
                        <option value="All">All</option>
                        <option value="Room 501">501</option><option value="Room 502">502</option><option value="Room 503">503</option><option value="Room 504">504</option><option value="Room 505">505</option><option value="Room 506">506</option><option value="Room 507">507</option>
                        <option value="Room 601">601</option><option value="Room 602">602</option>
                        <option value="Room 701">701</option><option value="Room 702">702</option>
                        <option value="Room 801">801</option><option value="Room 802">802</option>
                    </select>
                </div>
                <div>
                    <label>Institute Wise:</label>
                    <select id="filterInstitute">
                        <option value="All">All</option>
                        <option value="ITNU">ITNU</option><option value="IMNU">IMNU</option>
                        <option value="IPNU">IPNU</option><option value="ILNU">ILNU</option>
                        <option value="ISNU">ISNU</option><option value="IANU">IANU</option>
                    </select>
                </div>
                <div>
                    <label>Time Selection:</label>
                    <select id="filterTime">
                        <option value="All">All</option>
                        <option value="08:00 AM - 09:00 AM">08:00 AM - 09:00 AM</option>
                        <option value="09:00 AM - 10:00 AM">09:00 AM - 10:00 AM</option>
                        <option value="10:00 AM - 11:00 AM">10:00 AM - 11:00 AM</option>
                        <option value="11:00 AM - 12:00 PM">11:00 AM - 12:00 PM</option>
                        <option value="12:00 PM - 01:00 PM">12:00 PM - 01:00 PM</option>
                        <option value="01:00 PM - 02:00 PM">01:00 PM - 02:00 PM</option>
                        <option value="02:00 PM - 03:00 PM">02:00 PM - 03:00 PM</option>
                        <option value="03:00 PM - 04:00 PM">03:00 PM - 04:00 PM</option>
                        <option value="04:00 PM - 05:00 PM">04:00 PM - 05:00 PM</option>
                        <option value="05:00 PM - 06:00 PM">05:00 PM - 06:00 PM</option>
                    </select>
                </div>
            </div>

            <button class="main-btn" style="width: auto; padding: 10px 20px; font-size: 14px; background: #27ae60;" onclick="generateReport()">Generate Report</button>
            <button class="main-btn" style="width: auto; padding: 10px 20px; font-size: 14px; background: #64748b; margin-left: 10px;" onclick="window.print()">Print Report</button>

            <div style="overflow-x: auto; margin-top: 25px; display: none;" id="reportTableContainer">
                <table class="booking-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Floor</th>
                            <th>Room No</th>
                            <th>Booked By</th>
                            <th>Institute</th>
                            <th>Booking Timing</th>
                            <th class="no-print">Action</th> 
                        </tr>
                    </thead>
                    <tbody id="reportTableBody"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script>
    const BACKEND_URL = "https://nima-backend.vercel.app"; 
    
    const ALL_TIMES = ["08:00 AM - 09:00 AM", "09:00 AM - 10:00 AM", "10:00 AM - 11:00 AM", "11:00 AM - 12:00 PM", "12:00 PM - 01:00 PM", "01:00 PM - 02:00 PM", "02:00 PM - 03:00 PM", "03:00 PM - 04:00 PM", "04:00 PM - 05:00 PM", "05:00 PM - 06:00 PM"];
    const ALL_ROOMS = ["Room 501", "Room 502", "Room 503", "Room 504", "Room 505", "Room 506", "Room 507", "Room 601", "Room 602", "Room 701", "Room 702", "Room 801", "Room 802"];

    let globalBookings = []; 

    async function checkLogin() {
        const pass = document.getElementById("adminPass").value;
        try {
            const res = await fetch(`${BACKEND_URL}/admin-login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pass }) });
            const result = await res.json();
            if (result.status === "success") { 
                document.getElementById("loginOverlay").style.display = "none"; 
                fetchMasterData(); 
            } 
            else { alert("❌ Wrong Password"); }
        } catch (err) { alert("Server Error"); }
    }

    async function fetchMasterData() {
        try {
            const res = await fetch(`${BACKEND_URL}/admin/all-bookings`);
            const data = await res.json();
            if (data.bookings) {
                globalBookings = data.bookings.sort((a, b) => new Date(b.date) - new Date(a.date));
                generateReport(); 
            }
        } catch (err) { console.error("Error fetching data:", err); }
    }

    function generateReport() {
        const tbody = document.getElementById("reportTableBody");
        document.getElementById("reportTableContainer").style.display = "block";
        tbody.innerHTML = "";

        const fDateFrom = document.getElementById("filterDateFrom").value;
        const fDateTo = document.getElementById("filterDateTo").value;
        const fFloor = document.getElementById("filterFloor").value;
        const fRoom = document.getElementById("filterRoom").value;
        const fInstitute = document.getElementById("filterInstitute").value;
        const fTime = document.getElementById("filterTime").value;

        let filtered = globalBookings.filter(b => {
            let matches = true;
            
            if (fDateFrom && b.date < fDateFrom) matches = false;
            if (fDateTo && b.date > fDateTo) matches = false;
            
            if (fFloor !== "All") {
                const floorNum = b.room_id.replace("Room ", "").charAt(0);
                if (floorNum !== fFloor) matches = false;
            }
            
            if (fRoom !== "All" && b.room_id !== fRoom) matches = false;
            if (fInstitute !== "All" && b.institute !== fInstitute) matches = false;
            if (fTime !== "All" && b.time_slot !== fTime) matches = false;

            return matches;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No records match your filters.</td></tr>`;
            return;
        }

        filtered.forEach(b => {
            let floorCol = "N/A";
            if (b.room_id && b.room_id !== "N/A") {
                floorCol = b.room_id.replace("Room ", "").charAt(0) + "th Floor";
            }

            // Extract Name and Roll
            let leaderName = b.leader || b.leader_name || "N/A";
            let leaderRoll = b.roll_no || b.leader_roll_no || "N/A";
            let instDisplay = b.institute || "N/A";
            let trStyle = (leaderName === "ADMIN BLOCK" || leaderName === "MAINTENANCE") ? "background: #fff3e0;" : "";

            if (leaderName === "ADMIN BLOCK" || leaderName === "MAINTENANCE") { 
                instDisplay = "-"; 
                leaderRoll = "-";
            }

            // Create Name + Roll Number Display
            let bookedByDisplay = (leaderName === "ADMIN BLOCK" || leaderName === "MAINTENANCE") ? 
                `<strong>${leaderName}</strong>` : 
                `<strong>${leaderName}</strong><br><span style="font-size:12px; color:#888;">${leaderRoll}</span>`;

            const row = `
                <tr style="${trStyle}">
                    <td>${b.date}</td>
                    <td><strong>${floorCol}</strong></td>
                    <td>${b.room_id.replace("Room ", "")}</td>
                    <td>${bookedByDisplay}</td>
                    <td>${instDisplay}</td>
                    <td>${b.time_slot}</td>
                    <td class="no-print">
                        <button class="delete-btn" style="font-size:12px; padding:4px 8px;" onclick="deleteBooking('${b.room_id}', '${b.date}', '${b.time_slot}')">Cancel</button>
                    </td>
                </tr>`;
            tbody.innerHTML += row;
        });
    }

    async function deleteBooking(roomId, date, timeSlot) {
        if (!confirm(`Cancel this booking? The student will be notified.`)) return;
        try {
            await fetch(`${BACKEND_URL}/cancel-booking`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ room_id: roomId, date: date, time_slot: timeSlot }) });
            alert("Cancelled!");
            fetchMasterData(); 
        } catch (err) { alert("Failed."); }
    }

    async function blockDay() {
        const date = document.getElementById('blockDateInput').value;
        const reason = document.getElementById('blockReason').value || "Closed";
        if(!date) return alert("Select a date");
        try {
            await fetch(`${BACKEND_URL}/admin/block-day`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ date: date, reason: reason }) });
            alert("Date Blocked!");
        } catch (err) { alert("Error"); }
    }

    async function blockHourRange() {
        const date = document.getElementById('rangeDate').value;
        const start = document.getElementById('timeStart').value;
        const end = document.getElementById('timeEnd').value;
        if(!date) return alert("Select a date");
        const startIndex = ALL_TIMES.indexOf(start);
        const endIndex = ALL_TIMES.indexOf(end);
        if (startIndex > endIndex) return alert("❌ Invalid Range!");
        
        const slotsToBlock = ALL_TIMES.slice(startIndex, endIndex + 1);
        try {
            await fetch(`${BACKEND_URL}/admin/block-slots`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ date: date, slots: slotsToBlock, rooms: ALL_ROOMS }) });
            alert(`Blocked ${slotsToBlock.length} hours!`);
            fetchMasterData();
        } catch(err) { alert("Error"); }
    }
</script>

<style type="text/css" media="print">
    .no-print { display: none !important; }
    .admin-header, .control-grid, .filter-grid, .main-btn, #loginOverlay { display: none !important; }
    body { background: white; }
    .card { box-shadow: none; border: none; padding: 0; }
</style>
</body>
</html>
